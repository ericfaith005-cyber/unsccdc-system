{% extends "admin/change_list.html" %}
{% load i18n admin_urls static admin_list %}

{% block content_title %}
    <style>
        .ledger-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-panel { 
            background: rgba(10,10,10,0.8); border: 1px solid rgba(255,255,255,0.05); 
            padding: 25px; border-radius: 20px; border-bottom: 4px solid #D4AF37;
        }
        .stat-panel h2 { color: #fff; font-weight: 900; margin-top: 10px; font-size: 22px; }
        .stat-panel label { color: #666; font-size: 10px; letter-spacing: 2px; font-weight: bold; text-transform: uppercase; }
        .live-tag { color: #00ff00; font-size: 10px; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>

    <h1 style="color:#D4AF37; font-weight:900; letter-spacing:3px;">🛡️ NATIONAL FINANCIAL LEDGER</h1>
    <p class="live-tag">● LIVE AUDIT SYNC ACTIVE</p>

    <div class="ledger-stats">
        <div class="stat-panel" style="border-color: #FCDC04;">
            <label>Daily Intake</label>
            <h2>UGX {{ d_total|floatformat:0 }}</h2>
        </div>
        <div class="stat-panel" style="border-color: #D90000;">
            <label>Weekly Reserves</label>
            <h2>UGX {{ w_total|floatformat:0 }}</h2>
        </div>
        <div class="stat-panel" style="border-color: #000;">
            <label>Monthly Treasury</label>
            <h2>UGX {{ m_total|floatformat:0 }}</h2>
        </div>
    </div>
    
    {{ block.super }}
{% endblock %}

{% extends 'base.html' %}
{% block content %}
<div class="card imperial-card p-4">
    <div class="d-flex justify-content-between">
        <h3>User Identification</h3>
        <span class="badge bg-success p-2">Role: Admin/Developer</span>
    </div>
    <hr>
    <div class="row">
        <div class="col-md-6">
            <h5>Security Toggles</h5>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" checked>
                <label class="form-check-label">Two-Factor Authentication (2FA)</label>
            </div>
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-outline-danger btn-sm">Reset Password</button>
        </div>
    </div>
    <h5 class="mt-4">Security Audit Trail</h5>
    <table class="table table-sm text-muted">
        <thead><tr><th>Action</th><th>Timestamp</th><th>Node/IP</th></tr></thead>
        <tbody>
            {% for log in audit_trail %}
            <tr><td>{{ log.action }}</td><td>{{ log.time }}</td><td>{{ log.ip }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

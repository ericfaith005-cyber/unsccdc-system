<!DOCTYPE html>
<html>
<head>
    <title>UNSCCDC GLOBAL | Secure Login</title>
    <style>
        * { font-family: "Times New Roman", Times, serif; transition: 0.3s; }
        body { margin: 0; background: #000; overflow: hidden; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.25; object-fit: cover; filter: saturate(1.5) blur(2px); }

        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 2px solid #D4AF37;
            border-radius: 30px;
            padding: 50px;
            width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.1);
        }

        h1 { color: #D4AF37; letter-spacing: 4px; font-weight: 900; margin: 0; }
        input, select { 
            width: 100%; padding: 15px; margin: 10px 0; background: rgba(255,255,255,0.05); 
            border: 1px solid #333; border-radius: 12px; color: gold; outline: none; font-size: 16px;
        }
        input:focus { border-color: #D4AF37; background: rgba(255,255,255,0.1); }

        .btn-gold { 
            background: #D4AF37; color: black; border: none; padding: 18px; width: 100%; 
            border-radius: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 2px; margin-top: 20px;
        }
        .btn-gold:hover { transform: scale(1.03); background: #fff; box-shadow: 0 0 20px rgba(212,175,55,0.4); }
        
        .footer-links { margin-top: 25px; font-size: 12px; color: #666; }
        .footer-links a { color: #D4AF37; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-flag-of-uganda-waving-in-the-wind-32538-large.mp4" type="video/mp4">
    </video>

    <div class="auth-card">
        <div style="font-size: 50px; margin-bottom: 10px;">🎓</div>
        <h1>UNSCCDC</h1>
        <p style="font-size: 10px; color: #555; letter-spacing: 2px; margin-bottom: 30px;">NATIONAL COMMAND CENTRE</p>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="NATIONAL USER ID" required>
            <input type="password" name="password" placeholder="SECURE ACCESS KEY" required>
            <button type="submit" class="btn-gold">Authorize Entry</button>
        </form>

        <div class="footer-links">
            <a href="/api/register-school/">Enroll New School Node</a> <br><br>
            <a href="#">Forgot Access Key?</a>
        </div>
    </div>
</body>
</html>

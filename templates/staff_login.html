{% load static %}
<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>
    /* ... (Use the same styling as above, but with Red accents for staff) ... */
</style></head><body>
<div class="card" style="border-top: 5px solid #D90000;">
    <h1>STAFF COMMAND</h1>
    <p style="color:rgba(255,255,255,0.2); font-size:9px; letter-spacing:2px; margin-bottom:30px;">AUTHORIZATION REQUIRED</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/staff-login/">
        {% csrf_token %}
        <div class="input-box"><input type="text" name="name" placeholder="OFFICIAL STAFF NAME" required></div>
        <div class="input-box"><input type="password" name="pin" maxlength="4" placeholder="4-DIGIT PIN" style="text-align:center;" required></div>
        <button type="submit" class="access-btn" style="background:#D90000; color:#fff;">AUTHORIZE COMMAND</button>
    </form>
    <a href="/" style="display:block; margin-top:25px; color:rgba(255,255,255,0.2); text-decoration:none; font-size:10px;">← Back to Parent Gateway</a>
</div></body></html>

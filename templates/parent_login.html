{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNSCCDC | National Registry Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* 🛡️ THE Hub DARK-MODE SHIELD (STOPS THE WHITE PAGE) */
        body { 
            background-color: #000000 !important; 
            margin: 0; 
            color: #ffffff; 
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.02);
            padding: 40px;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .logo { height: 80px; margin-bottom: 15px; filter: drop-shadow(0 0 10px #D4AF37); }
        h1 { font-family: 'Orbitron', sans-serif; color: #D4AF37; font-size: 20px; letter-spacing: 3px; margin: 0; }
        
        .input-group { margin-top: 20px; text-align: left; }
        label { font-size: 9px; color: #D4AF37; font-weight: bold; letter-spacing: 1.5px; }
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: #fff; font-size: 14px; margin-top: 5px; outline: none;
            box-sizing: border-box;
        }
        
        .gold-btn {
            width: 100%; background: #D4AF37; color: #000; border: none; padding: 18px;
            border-radius: 15px; font-weight: 900; font-size: 13px; letter-spacing: 2px;
            cursor: pointer; margin-top: 30px; text-transform: uppercase;
        }

        .error-banner {
            background: rgba(217, 0, 0, 0.2);
            color: #ff8888;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 11px;
            border: 1px solid #D90000;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- 🖼️ National Seal -->
        <img src="{% static 'icons/hub_logo.png' %}" class="logo" alt="UNSCCDC Seal">
        <h1>UNSCCDC GLOBAL</h1>
        <p style="color: #444; font-size: 8px; letter-spacing: 2px; font-weight: bold;">NATIONAL Hub GATEWAY</p>

        <!-- ⚠️ Error Message -->
        {% if error %}
            <div class="error-banner">{{ error }}</div>
        {% endif %}

        <!-- 🛡️ NATIVE SECURE FORM -->
        <form action="{% url 'parent_login' %}" method="POST">
            {% csrf_token %}
            
            <div class="input-group">
                <label>NATIONAL ACCESS CODE</label>
                <input type="text" name="code" placeholder="e.g. PS 001" required>
            </div>

            <div class="input-group">
                <label>STUDENT FULL NAME</label>
                <input type="text" name="student" placeholder="Full Legal Name" required>
            </div>

            <div class="input-group">
                <label>PARENT/GUARDIAN NAME</label>
                <input type="text" name="parent" placeholder="Registered Guardian" required>
            </div>

            <div class="input-group">
                <label>PHONE NUMBER</label>
                <input type="text" name="phone" placeholder="2567..." required>
            </div>

            <button type="submit" class="gold-btn">VERIFY IDENTITY</button>
        </form>

        <a href="/staff-login/" style="display:block; margin-top:25px; color:rgba(255,255,255,0.2); text-decoration:none; font-size:10px; font-weight:bold;">ENTER STAFF COMMAND PORTAL →</a>
    </div>

</body>
</html>

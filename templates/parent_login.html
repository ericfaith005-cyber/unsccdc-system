{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNSCCDC | Parent Registry Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #D4AF37; --red: #D90000; --black: #080808; }
        body { 
            background: var(--black); color: #fff; font-family: 'Rajdhani', sans-serif; 
            margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh;
        }
        .flag-top {
            position: fixed; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, #000 16%, #FCDC04 16%, #FCDC04 33%, #D90000 33%, #D90000 50%, #000 50%, #000 66%, #FCDC04 66%, #FCDC04 83%, #D90000 83%);
            background-size: 200% 100%; z-index: 1000;
        }
        .login-card {
            width: 90%; max-width: 420px; background: rgba(255,255,255,0.02); 
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8); text-align: center;
        }
        .logo { height: 70px; margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--gold)); }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--gold); font-size: 20px; letter-spacing: 3px; margin: 0; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 9px; color: var(--gold); font-weight: bold; letter-spacing: 1.5px; margin-left: 5px; }
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 14px; border-radius: 12px; color: #fff; font-size: 14px; margin-top: 5px; outline: none;
        }
        input:focus { border-color: var(--gold); background: rgba(255,255,255,0.08); }
        .gold-btn {
            width: 100%; background: var(--gold); color: #000; border: none; padding: 18px;
            border-radius: 15px; font-weight: 900; font-size: 13px; letter-spacing: 2px;
            cursor: pointer; margin-top: 20px; text-transform: uppercase;
        }
        .error-msg { background: rgba(217, 0, 0, 0.1); color: #ff8888; padding: 10px; border-radius: 10px; font-size: 11px; margin-bottom: 20px; border: 1px solid var(--red); }
        .staff-link { display: block; margin-top: 25px; color: rgba(255,255,255,0.3); text-decoration: none; font-size: 10px; font-weight: bold; letter-spacing: 1px; }
        .staff-link:hover { color: var(--gold); }
    </style>
</head>
<body>
    <div class="flag-top"></div>
    <div class="login-card">
        <img src="{% static 'icons/hub_logo.png' %}" class="logo">
        <h1>UNSCCDC GLOBAL</h1>
        <p style="color: #666; font-size: 8px; letter-spacing: 2px; margin-bottom: 30px;">NATIONAL EDUCATION CENTRE</p>

        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}

        <form action="{% url 'parent_login' %}" method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>NATIONAL ACCESS CODE</label>
                <input type="text" name="code" placeholder="e.g. PS 001" required>
            </div>
            <div class="input-group">
                <label>STUDENT FULL NAME</label>
                <input type="text" name="student" placeholder="Enter student name" required>
            </div>
            <div class="input-group">
                <label>PARENT NAME</label>
                <input type="text" name="parent" placeholder="Enter guardian name" required>
            </div>
            <div class="input-group">
                <label>PHONE NUMBER</label>
                <input type="text" name="phone" placeholder="256..." required>
            </div>
            <button type="submit" class="gold-btn">VERIFY IDENTITY</button>
        </form>

        <a href="{% url 'staff_login' %}" class="staff-link">ENTER STAFF COMMAND PORTAL →</a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNSCCDC | National Registry</title>

    <style>
        /* 🏛️ IMPERIAL INLINE CSS - INDESTRUCTIBLE FOUNDATION */
        :root { --gold: #D4AF37; --red: #D90000; --dark: #000000; --card: #0a0a0a; --input-bg: #111111; }

        html, body {
            background-color: var(--dark) !important;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 🇺🇬 NATIONAL Hub AURA */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, #000 16%, #FCDC04 16%, #FCDC04 33%, #D90000 33%, #D90000 50%, #000 50%, #000 66%, #FCDC04 66%, #FCDC04 83%, #D90000 83%);
            z-index: 1000;
        }

        .login-card {
            width: 85%;
            max-width: 400px;
            background: var(--card);
            padding: 40px 30px;
            border-radius: 35px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            position: relative;
        }

        .logo-text {
            color: var(--gold);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 5px;
            margin: 0;
            text-transform: uppercase;
        }

        .sub-brand {
            color: rgba(255,255,255,0.4);
            font-size: 9px;
            letter-spacing: 3px;
            margin-top: 5px;
            margin-bottom: 35px;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 9px; color: var(--gold); font-weight: bold; letter-spacing: 1.5px; margin-left: 5px; }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid #222;
            padding: 16px;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            margin-top: 6px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--gold); background: #151515; }

        .gold-btn {
            width: 100%;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 25px;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .gold-btn:active { transform: scale(0.98); opacity: 0.9; }

        /* ⏳ Hub STATUS OVERLAY */
        #loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            border-radius: 35px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .spinner {
            border: 4px solid #111;
            border-top: 4px solid var(--gold);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-msg {
            background: rgba(217, 0, 0, 0.15);
            color: #ff8888;
            padding: 12px;
            border-radius: 10px;
            font-size: 11px;
            border: 1px solid var(--red);
            margin-bottom: 25px;
        }

        .staff-door {
            display: block;
            margin-top: 30px;
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- ⏳ Hub SATELLITE LOADER -->
        <div id="loading-overlay">
            <div class="spinner"></div>
            <p style="color: var(--gold); font-size: 10px; margin-top: 20px; letter-spacing: 2px;">ESTABLISHING NATIONAL LINK...</p>
        </div>

        <p class="logo-text">UNSCCDC GLOBAL</p>
        <p class="sub-brand">NATIONAL EDUCATION CENTRE</p>

        <!-- 🛡️ ERROR FEEDBACK -->
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <!-- 🚀 THE Hub GATEWAY FORM -->
        <form id="authForm" action="{% url 'parent_login' %}" method="POST" onsubmit="return handleSovereignSubmit()">
            {% csrf_token %}
            
            <div class="input-group">
                <label>NATIONAL ACCESS CODE</label>
                <input type="text" name="code" id="code" placeholder="e.g. PS 001" autocomplete="off">
            </div>

            <div class="input-group">
                <label>STUDENT FULL NAME</label>
                <input type="text" name="student" id="student" placeholder="Legal Name" autocomplete="off">
            </div>

            <div class="input-group">
                <label>PARENT NAME</label>
                <input type="text" name="parent" id="parent" placeholder="Guardian Name" autocomplete="off">
            </div>

            <div class="input-group">
                <label>PHONE NUMBER</label>
                <input type="text" name="phone" id="phone" placeholder="2567..." autocomplete="off">
            </div>

            <button type="submit" class="gold-btn">VERIFY IDENTITY</button>
        </form>

        <a href="/staff-login/" class="staff-door">ENTER STAFF COMMAND PORTAL →</a>
    </div>

    <!-- ⚙️ CRASH-PROOF Hub SCRIPT -->
    <script>
        function handleSovereignSubmit() {
            try {
                const overlay = document.getElementById('loading-overlay');
                const fields = ['code', 'student', 'parent', 'phone'];
                let allFilled = true;

                // 🛡️ 1. Immediate Validation Shield
                fields.forEach(id => {
                    const el = document.getElementById(id);
                    if (!el || el.value.trim() === "") {
                        allFilled = false;
                    }
                });

                if (!allFilled) {
                    alert("NATIONAL Hub: Please fill in all registration details before proceeding.");
                    return false;
                }

                // ⚡ 2. Activate Animation ONLY on valid submit
                if (overlay) {
                    overlay.style.display = 'flex';
                }
                
                return true; // Proceed to Native Django POST

            } catch (e) {
                // 🕵️ 3. Safety Fallback: Log error but don't freeze the UI
                console.error("Hub Handshake Interrupted:", e);
                return true; 
            }
        }

        // --- 🛡️ EMERGENCY WIPE: Kill any stubborn loaders on page show ---
        window.onpageshow = function() {
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.style.display = 'none';
        };
    </script>
</body>
</html>

{% extends "admin/base_site.html" %}
{% block content %}
<style>
    :root { --neon-blue: #00d4ff; --neon-green: #39ff14; --gold: #D4AF37; --obsidian: #080808; }
    * { font-family: "Times New Roman", Times, serif !important; }
    #content { background: #050a18 !important; color: white; padding: 20px !important; }

    .designer-card { background: rgba(255,255,255,0.02); border: 1px solid #1a2a3a; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .panel-label { color: var(--neon-blue); font-size: 11px; font-weight: 900; letter-spacing: 2px; display: block; margin-bottom: 15px; text-transform: uppercase; }
    
    /* 🔘 BUTTON STYLES FROM YOUR PHOTO */
    .btn-save { background: #32ff7e; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-new { background: transparent; color: white; border: 1px solid var(--neon-blue); padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    .btn-mode { background: var(--neon-blue); color: black; border: none; padding: 10px 15px; border-radius: 5px; font-size: 11px; font-weight: bold; }
    .btn-clear { background: #ff3860; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    
    input[type=range] { width: 300px; accent-color: var(--neon-blue); }
    select { background: #000; color: white; border: 1px solid #333; padding: 10px; border-radius: 5px; width: 300px; }
</style>

<form id="designForm" method="POST" action="/api/save-design/">
    {% csrf_token %}
    
    <!-- 1. DOCUMENT TARGET -->
    <div class="designer-card">
        <span class="panel-label">DOCUMENT TARGET & SIZE</span>
        <div style="display:flex; gap:20px; align-items:center;">
            <select name="target_type">
                <option value="REPORT">Official School Report Card</option>
                <option value="KEB">KEB Mock Result Slip</option>
            </select>
            <select name="page_format">
                <option value="A4">A4 Standard Page</option>
                <option value="A5">A5 Mini (Two per A4)</option>
                <option value="LEGAL">Long Legal Paper</option>
            </select>
            <button type="submit" class="btn-save">💾 Save Design</button>
        </div>
    </div>

    <!-- 2. BACKGROUND & WATERMARK -->
    <div class="designer-card">
        <span class="panel-label">BACKGROUND & WATERMARK</span>
        <div style="display:flex; align-items:center; gap:30px; flex-wrap:wrap;">
            <button type="button" class="btn-new">📂 Upload Background / Seal</button>
            
            <div style="display:flex; gap:2px; background:#111; border-radius:5px;">
                <button type="button" class="btn-mode">Active Background</button>
                <button type="button" style="background:transparent; color:white; border:none; padding:10px;">Guide Only</button>
            </div>

            <div style="display:flex; align-items:center; gap:10px;">
                <span>Opacity:</span>
                <input type="range" name="opacity" min="0" max="20" value="5" id="opacityRange">
                <span id="opacityVal">5%</span>
            </div>

            <button type="button" class="btn-clear">✕ Clear</button>
        </div>
    </div>

    <!-- 3. COLOR THEMES -->
    <div class="designer-card">
        <span class="panel-label">COLOR THEMES & BRANDING</span>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <input type="color" name="primary_color" value="#002366" style="height:40px; width:100px; background:none; border:none;">
            <button type="button" class="btn-new" style="border-color:gold; color:gold;">🏆 Royal Gold</button>
            <button type="button" class="btn-new" style="border-color:#00d4ff; color:#00d4ff;">🌊 Ocean Blue</button>
            <button type="button" class="btn-new" style="border-color:#32ff7e; color:#32ff7e;">🌲 Forest Green</button>
        </div>
    </div>
</form>

<script>
    // 🎚️ Live Opacity Display
    document.getElementById('opacityRange').oninput = function() {
        document.getElementById('opacityVal').innerText = this.value + "%";
    }

    // ⚡ AJAX Save
    document.getElementById('designForm').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const res = await fetch(e.target.action, { method: 'POST', body: formData });
        const data = await res.json();
        alert(data.msg);
    }
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNSCCDC | National Hub Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --red: #D90000; --black: #000; --glass: rgba(255, 255, 255, 0.03); }
        
        body { 
            background: #000; color: #fff; font-family: 'Rajdhani', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        /* 🌌 THE MOVING GALAXY BACKGROUND */
        #star-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        /* 🇺🇬 THE NATIONAL RIBBON */
        .flag-top {
            position: fixed; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(90deg, #000 16%, #FCDC04 16%, #FCDC04 33%, #D90000 33%, #D90000 50%, #000 50%, #000 66%, #FCDC04 66%, #FCDC04 83%, #D90000 83%);
            background-size: 200% 100%; animation: ribbonFlow 4s linear infinite; z-index: 1000;
        }
        @keyframes ribbonFlow { from { background-position: 200% 0; } to { background-position: 0 0; } }

        /* 🛡️ THE HUD CONTAINER */
        .hub-container {
            width: 90%; max-width: 450px; background: var(--glass); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8); text-align: center;
            animation: fadeIn 1s ease-out;
        }

        .logo { height: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--gold)); }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--gold); font-size: 22px; letter-spacing: 4px; margin: 0; }
        .sub-text { font-size: 8px; color: rgba(255,255,255,0.4); letter-spacing: 2px; margin-bottom: 30px; }

        /* 🔑 INPUT STYLING */
        .input-group { margin-bottom: 20px; text-align: left; }
        label { font-size: 9px; color: var(--gold); font-weight: bold; letter-spacing: 1.5px; padding-left: 5px; }
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 12px; color: #fff; font-size: 14px; margin-top: 5px;
            transition: 0.3s; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--gold); background: rgba(255,255,255,0.08); }

        /* ⚡ BUTTON STYLING */
        .gold-btn {
            width: 100%; background: var(--gold); color: #000; border: none; padding: 18px;
            border-radius: 15px; font-weight: 900; font-size: 14px; letter-spacing: 2px;
            cursor: pointer; margin-top: 20px; transition: 0.4s;
        }
        .gold-btn:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(212,175,55,0.4); }

        /* ⏳ LOADER OVERLAY */
        #loader {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); border-radius: 30px; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        .spinner { border: 4px solid #111; border-top: 4px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>
    <div class="flag-top"></div>

    <div class="hub-container">
        <!-- ⏳ LOADER -->
        <div id="loader">
            <div class="spinner"></div>
            <p style="color: var(--gold); font-size: 10px; margin-top: 20px; letter-spacing: 2px;" id="loader-text">ESTABLISHING LINK...</p>
        </div>

        <img src="/static/icons/hub_logo.png" class="logo" alt="UNSCCDC Seal">
        <h1>UNSCCDC GLOBAL</h1>
        <p class="sub-text">NATIONAL SCHOOLS CENTRAL CONTROL CENTRE</p>

        <!-- 📦 STAGE 1: IDENTITY GATE -->
        <div id="identity-gate">
            <div class="input-group">
                <label>NATIONAL ACCESS CODE</label>
                <input type="text" id="code" placeholder="e.g. PS 001">
            </div>
            <div class="input-group">
                <label>STUDENT FULL NAME</label>
                <input type="text" id="student" placeholder="Full Legal Name">
            </div>
            <div class="input-group">
                <label>PARENT/GUARDIAN NAME</label>
                <input type="text" id="parent" placeholder="Guardian Name">
            </div>
            <div class="input-group">
                <label>REGISTERED PHONE NUMBER</label>
                <input type="text" id="phone" placeholder="2567...">
            </div>
            <button class="gold-btn" onclick="initiateHandshake()">VERIFY IDENTITY</button>
        </div>

        <!-- 🔑 STAGE 2: PIN VAULT (Hidden) -->
        <div id="pin-vault" style="display: none;">
            <h3 style="color: var(--gold); margin-bottom: 5px;">IDENTITY VERIFIED ✅</h3>
            <p style="color: #666; font-size: 11px; margin-bottom: 30px;">ENTER YOUR 4-DIGIT SOVEREIGN PIN</p>
            <input type="password" id="pin" maxlength="4" style="text-align: center; font-size: 32px; letter-spacing: 20px;">
            <button class="gold-btn" onclick="authorizeAccess()" style="background: var(--red); color: #fff;">AUTHORIZE ACCESS</button>
            <p onclick="location.reload()" style="font-size: 10px; color: #444; margin-top: 20px; cursor: pointer;">← Back to Identity Gate</p>
        </div>
    </div>

    <script>
        const hubIP = "https://unsccdc-system.onrender.com";

        async function initiateHandshake() {
            const code = document.getElementById('code').value.trim();
            const student = document.getElementById('student').value.trim();
            const parent = document.getElementById('parent').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const loader = document.getElementById('loader');

            if (!code || !student || !parent || !phone) {
                alert("REGISTRY ERROR: All fields are required for National Verification.");
                return;
            }

            loader.style.display = 'flex';
            document.getElementById('loader-text').innerText = "QUERYING NATIONAL REGISTRY...";

            try {
                // 💎 THE IMPERIAL HANDSHAKE
                const url = `${hubIP}/api/verify-identity/?code=${code}&student=${student}&parent=${parent}&phone=${phone}`;
                
                const response = await fetch(url, {
                    method: 'POST', // Log shows OPTIONS then POST/GET
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.status === 200 && data.status === 'authenticated') {
                    // 🚀 TRANSITION TO STAGE 2
                    document.getElementById('identity-gate').style.display = 'none';
                    document.getElementById('pin-vault').style.display = 'block';
                    loader.style.display = 'none';
                } else {
                    loader.style.display = 'none';
                    alert(data.message || "Identity Rejected: Check your details.");
                }
            } catch (err) {
                loader.style.display = 'none';
                alert("NATIONAL LINK INTERRUPTED: The Brain is waking up. Try again in 10s.");
            }
        }

        // --- 🌌 STARFIELD ENGINE ---
        const canvas = document.getElementById('star-canvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        for(let i=0; i<150; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.5, speed: Math.random()*0.5});

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            stars.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
                s.y += s.speed; if(s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNSCCDC | National Control Centre</title>

    <!-- 🌐 1. IMPERIAL PWA SATELLITE LINKS -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{% static 'icon-192.png' %}">

    <!-- 🎨 2. HIGH-PRESTIGE STYLING (Bootstrap 5 + Custom Obsidian) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { 
            --uns-gold: #D4AF37; 
            --uns-dark: #050505; 
            --uns-glass: rgba(255, 255, 255, 0.03); 
        }

        body { 
            background-color: var(--uns-dark); 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* 🏛️ THE IMPERIAL NAVBAR */
        .navbar { 
            background: rgba(10, 10, 10, 0.95) !important; 
            backdrop-filter: blur(15px);
            border-bottom: 2px solid var(--uns-gold);
            padding: 15px 0;
        }

        .navbar-brand { font-weight: 900; color: var(--uns-gold) !important; letter-spacing: 2px; }

        .nav-link { 
            color: #888 !important; 
            font-weight: 700; 
            font-size: 11px; 
            letter-spacing: 1.5px; 
            margin: 0 10px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .nav-link:hover, .nav-link.active { 
            color: var(--uns-gold) !important; 
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        /* 💎 CONTENT CARDS */
        .imperial-card {
            background: var(--uns-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            margin-top: 20px;
        }

        /* 📱 INSTALL PROMPT SNACKBAR */
        #pwa-prompt {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--uns-gold);
            color: #000;
            padding: 15px;
            border-radius: 15px;
            z-index: 10000;
            font-weight: 900;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- 🏛️ NATIONAL NAVIGATION -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">UNSCCDC GLOBAL</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#imperialNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="imperialNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">1. Home</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}" href="{% url 'about' %}">2. About</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'academics' %}active{% endif %}" href="{% url 'academics' %}">3. Academics</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'finances' %}active{% endif %}" href="{% url 'finances' %}">4. Finances</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}">5. Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/" style="border: 1px solid var(--uns-gold); border-radius: 8px; padding: 5px 15px !important;">Office</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 📺 IMPERIAL CONTENT AREA -->
    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>

    <!-- 📥 PWA INSTALL SNACKBAR -->
    <div id="pwa-prompt" onclick="installPWA()">
        📥 INSTALL UG SCHOOLS DIGITAL HUB TO HOME SCREEN
    </div>

    <!-- ⚙️ 3. IMPERIAL SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // --- 🛡️ SERVICE WORKER REGISTRY ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/serviceworker.js').then(function(reg) {
                    console.log('Hub Satellite Online:', reg.scope);
                }, function(err) {
                    console.log('Satellite Link Failed:', err);
                });
            });
        }

        // --- 📲 PWA INSTALL LOGIC ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-prompt').style.display = 'block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('pwa-prompt').style.display = 'none';
                    }
                });
            }
        }
    </script>
</body>
</html>

{% extends "admin/login.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style type="text/css">
    body.login {
        background: linear-gradient(rgba(0, 31, 63, 0.9), rgba(0, 31, 63, 0.9)),
                    url('https://images.unsplash.com/photo-1523050853061-80e8a4ff147e?auto=format&fit=crop&w=1000&q=80') !important;
        background-size: cover !important;
        font-family: 'Segoe UI', sans-serif;
    }
    #header { background: #001F3F !important; border-bottom: 4px solid #E65100 !important; }
    .login #content-main {
        background: rgba(255, 255, 255, 0.98);
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        border: 1px solid #E65100;
        margin-top: 50px;
    }
    #site-name { display: none; }

    .un-logo { width: 120px; margin-bottom: 10px; filter: drop-shadow(0 5px 15px rgba(230, 81, 0, 0.4)); }

    .login h1 {
        color: #001F3F !important;
        font-weight: 900 !important;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 0;
    }
    .national-tag { color: #E65100; font-weight: bold; font-size: 10px; margin-bottom: 20px; }

    input[type="submit"] {
        background: #001F3F !important;
        border: 2px solid #E65100 !important;
        border-radius: 12px !important;
        height: 50px !important;
        transition: 0.3s;
    }
    input[type="submit"]:hover { background: #E65100 !important; color: white !important; transform: scale(1.02); }
</style>
{% endblock %}

{% block branding %}
<div style="text-align: center; padding-top: 20px;">
    <img src="{% static 'admin_custom/logo.png' %}" class="un-logo" alt="UNSCCDC SEAL">
    <h1>UNSCCDC</h1>
    <div class="national-tag">UGANDA NATIONAL SCHOOLS CENTRAL CONTROL DIGITAL CENTRE</div>
</div>
{% endblock %}

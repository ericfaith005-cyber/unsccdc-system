<!-- 🔑 STAGE 2: THE PIN VAULT -->
<!DOCTYPE html>
<html>
<head>
    <title>UNSCCDC | Secure PIN</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .pin-card { background: rgba(255,255,255,0.03); padding: 40px; border-radius: 30px; border: 1px solid #D4AF37; text-align: center; }
        input { background: #111; border: 1px solid #333; color: #D4AF37; font-size: 32px; width: 200px; text-align: center; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="pin-card">
        <h2 style="color: #D4AF37;">IDENTITY VERIFIED ✅</h2>
        <p>Welcome, {{ student.full_name }}</p>
        <p style="color: #666; font-size: 11px;">ENTER YOUR 4-DIGIT SECURE PIN</p>
        <form action="/api/final-login/" method="POST">
            <input type="password" name="pin" maxlength="4" autofocus>
            <input type="hidden" name="student_id" value="{{ student.account_number }}">
            <br><br>
            <button type="submit" style="background:#D4AF37; color:#000; padding:15px 30px; border:none; border-radius:10px; font-weight:bold;">
                AUTHORIZE HUB ACCESS
            </button>
        </form>
    </div>
</body>
</html>
